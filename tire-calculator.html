<h1>Tire Pricing Calculator</h1>
<form id="tire-form">
  <label for="price">Price per tire ($):</label>
  <input type="number" id="price" step="0.01" required>

  <label for="quantity">Quantity:</label>
  <input type="number" id="quantity" value="4" min="1" required>

  <label for="tax">Tax rate (%):</label>
  <input type="number" id="tax" value="8" step="0.01" required>

  <label for="discount">Discount (%):</label>
  <input type="number" id="discount" value="0" step="0.01" required>

  <button type="button" id="calc-btn">Calculate</button>
</form>

<p id="output"></p>

<script>
  document.getElementById('calc-btn').addEventListener('click', function() {
    var price = parseFloat(document.getElementById('price').value) || 0;
    var qty = parseInt(document.getElementById('quantity').value) || 0;
    var tax = parseFloat(document.getElementById('tax').value) || 0;
    var discount = parseFloat(document.getElementById('discount').value) || 0;

    var subtotal = price * qty;
    var discountAmount = subtotal * (discount / 100);
    var taxed = (subtotal - discountAmount) * (1 + tax / 100);

    document.getElementById('output').textContent =
      'Total price: $' + taxed.toFixed(2);
  });
</script>
